# Rename to <your-domain> in /etc/nginx/sites-available/ and set a DNS A record.
# TLS: point ssl_certificate at your own cert (this template assumes a wildcard).
server {
    listen 443 ssl;
    http2 on;
    server_name temp.example.com;

    ssl_certificate     /etc/ssl/your-wildcard/fullchain.pem;
    ssl_certificate_key /etc/ssl/your-wildcard/privkey.pem;

    # uploads: keep this >= MAX_UPLOAD_MB in the service, or nginx rejects first
    client_max_body_size 900M;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://127.0.0.1:19011;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # the app reads this for the per-share visitor log
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: send plain HTTP to HTTPS
server {
    listen 80;
    server_name temp.example.com;
    return 301 https://$host$request_uri;
}
